
{% extends "base.html" %}

{% block title %}Staff Login | Skyline Club{% endblock %}

{% block content %}

<section class="login-page">
    <h1>Staff Login</h1>
    <p>Sign in to access your assigned club responsibilities.</p>

    <form method="post" class="card" style="max-width: 400px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="email">Staff email</label>
        <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Log in</button>
    </form>

    <p>
        <a href="{{ url_for('login_choice') }}">← Back to login options</a>
    </p>
</section>

{% endblock %}
