{% extends 'base.html' %}
{% block content %}
<h1>Claim an expense</h1>
<form method="post" enctype="multipart/form-data" class="card" style="max-width:520px">
  <label>Your member email</label><input name="email" type="email" required>
  <label>Amount (₹)</label><input name="amount" type="number" step="0.01" min="0.01" required>
  <label>What was it for?</label><input name="description" required>
  <label>Receipt (photo or PDF, up to 5 MB)</label><input name="receipt" type="file" accept="image/*,.pdf">
  <br><button type="submit">Submit claim</button>
</form>
{% endblock %}
